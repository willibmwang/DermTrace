name: Expression completion checks

on:
  pull_request:
    paths:
      - 'experiments/expression_completion/**'
      - '.github/workflows/expression-completion-checks.yml'
  push:
    paths:
      - 'experiments/expression_completion/**'
      - '.github/workflows/expression-completion-checks.yml'

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas scipy pyarrow threadpoolctl
      - name: Run completion tests
        run: python -m unittest discover -s experiments/expression_completion -t . -p 'test_*.py' -v
