name: Revision checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-revision.txt
      - run: python -m pip install -r requirements-revision.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/revision_report.py
      - run: python scripts/run_marker_benchmark.py --report-only
      - run: python scripts/generate_revision_docs.py
      - run: python scripts/replay_narrative_audit.py results/reviewer_revision/narrative_audit/deterministic_v1/responses.jsonl
      - run: git diff --exit-code -- results/reviewer_revision/evaluation.json results/reviewer_revision/matched_results.json README.md manuscript/reviewer_revision_results.md
