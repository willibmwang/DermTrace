name: GSE145725 processed data
on:
  push:
    paths:
      - 'data/processed/microarray/GSE145725/**'
      - 'keloidbench/scripts/ingest_gse145725.py'
      - 'keloidbench/scripts/preprocess_microarray.py'
      - 'keloidbench/scripts/expression_processing.py'
      - 'keloidbench/scripts/gene_modules.py'
      - 'keloidbench/scripts/build_training_corpus.py'
      - 'keloidbench/tests/test_gse145725.py'
      - 'keloidbench/requirements-gse145725.txt'
      - '.github/workflows/gse145725.yml'
  pull_request:
    paths:
      - 'data/processed/microarray/GSE145725/**'
      - 'keloidbench/**'
      - '.github/workflows/gse145725.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: keloidbench/requirements-gse145725.txt
      - run: python -m pip install -r keloidbench/requirements-gse145725.txt
      - run: python -m unittest discover -s keloidbench/tests -p test_gse145725.py -v
